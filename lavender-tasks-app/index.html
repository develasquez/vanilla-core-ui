<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lavender Tasks Suite — Vanilla-Core M3</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/vendor/material-web/material-symbols.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css">
  
  <script type="module" src="/vendor/material-web/material-web.bundle.js"></script>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased select-none">
  
  <header id="header-container" class="w-full bg-[var(--md-sys-color-surface-container-lowest)] border-b border-[var(--md-sys-color-outline-variant)] px-4 lg:px-6 py-3.5 z-30"></header>
  
  <div class="flex-1 flex flex-col lg:flex-row w-full overflow-hidden">
    
    <aside id="sidebar-container" class="hidden lg:flex flex-col w-64 bg-[var(--md-sys-color-surface-container-low)] p-4 flex-shrink-0 border-r border-[var(--md-sys-color-outline-variant)]"></aside>

    <main id="main-content" class="flex-1 flex flex-col overflow-y-auto p-4 lg:p-6 space-y-6 pb-24 lg:pb-6">
      
      <section id="metrics-container"></section>

      <section id="controls-container"></section>

      <section id="kanban-container"></section>

    </main>

  </div>

  <nav id="bottom-nav-container" class="lg:hidden fixed bottom-0 left-0 right-0 z-40"></nav>

  <md-dialog id="task-dialog">
    <div slot="headline" id="task-dialog-title">Nueva Tarea</div>
    <form slot="content" id="task-dialog-form" method="dialog" class="space-y-4 pt-2">
      <md-outlined-text-field id="input-task-title" label="Título de la tarea" class="w-full" required></md-outlined-text-field>
      
      <div class="grid grid-cols-2 gap-3">
        <md-outlined-text-field id="input-task-tag" label="Etiqueta / Tag" value="Core"></md-outlined-text-field>
        <md-outlined-text-field id="input-task-due" label="Fecha de entrega" value="Hoy"></md-outlined-text-field>
      </div>

      <div>
        <label class="text-xs font-semibold text-[var(--md-sys-color-on-surface-variant)] block mb-1">Prioridad</label>
        <div class="flex gap-2" id="priority-options">
          <button type="button" class="priority-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-[var(--md-sys-color-surface-container)]" data-priority="low">Baja</button>
          <button type="button" class="priority-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-[var(--md-sys-color-surface-container)]" data-priority="medium">Media</button>
          <button type="button" class="priority-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-[var(--md-sys-color-primary-container)] text-[var(--md-sys-color-on-primary-container)]" data-priority="high">Alta</button>
        </div>
      </div>
    </form>
    <div slot="actions">
      <md-text-button id="btn-dialog-cancel">Cancelar</md-text-button>
      <md-filled-button id="btn-dialog-save">Guardar Tarea</md-filled-button>
    </div>
  </md-dialog>

  <script type="module" src="/load.js"></script>
</body>
</html>
