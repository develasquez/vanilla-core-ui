<div class="flex flex-col h-full justify-between">
  <div class="space-y-1">
    <div class="px-3 py-2 text-[11px] font-bold uppercase tracking-wider text-[var(--md-sys-color-on-surface-variant)]">Espacios de Trabajo</div>
    
    <button class="m3-sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-full text-sm font-medium bg-[var(--md-sys-color-primary-container)] text-[var(--md-sys-color-on-primary-container)] text-left transition-colors" data-view="all">
      <span class="material-symbols-outlined text-[20px]">view_kanban</span>
      <span>Todas las Tareas</span>
    </button>
    
    <button class="m3-sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-full text-sm font-medium text-[var(--md-sys-color-on-surface-variant)] hover:bg-[var(--md-sys-color-surface-container-high)] text-left transition-colors" data-view="high-priority">
      <span class="material-symbols-outlined text-[20px]">priority_high</span>
      <span>Prioridad Alta</span>
    </button>

    <button class="m3-sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-full text-sm font-medium text-[var(--md-sys-color-on-surface-variant)] hover:bg-[var(--md-sys-color-surface-container-high)] text-left transition-colors" data-view="sprint">
      <span class="material-symbols-outlined text-[20px]">schedule</span>
      <span>Sprint Activo</span>
    </button>
  </div>

  <div class="m3-card p-4 space-y-3 bg-[var(--md-sys-color-surface-container)] border-none">
    <div class="flex items-center justify-between">
      <span class="text-xs font-semibold text-[var(--md-sys-color-on-surface)]">Eficiencia de Equipo</span>
      <span class="m3-badge-success">+24%</span>
    </div>
    <div class="w-full bg-[var(--md-sys-color-surface-container-high)] h-2 rounded-full overflow-hidden">
      <div class="bg-[var(--md-sys-color-primary)] h-full w-[85%] rounded-full"></div>
    </div>
    <p class="text-[11px] text-[var(--md-sys-color-on-surface-variant)]">85% de entregas completadas a tiempo esta semana.</p>
  </div>
</div>
